    function Button({
      variant = 'primary',
      size = 'md',
      disabled = false,
      type = 'button',
      className = '',
      children,
      ...props
    }) {
      const base =
        'inline-flex items-center justify-center gap-1.5 rounded-full font-medium transition ' +
        'focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-teal-500 ' +
        'disabled:opacity-40 disabled:cursor-not-allowed';

      const variants = {
        primary:   'bg-teal-700 text-white hover:bg-teal-800 shadow-sm',
        secondary: 'bg-white text-stone-700 border border-stone-300 hover:bg-stone-50',
        ghost:     'text-stone-500 hover:text-stone-800 hover:bg-stone-200/70',
        danger:    'bg-rose-600 text-white hover:bg-rose-700',
      };

      const sizes = {
        sm: 'px-3 py-1.5 text-xs',
        md: 'px-4 py-2 text-sm',
        lg: 'px-6 py-3 text-base',
      };

      return (

          disabled={disabled}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}

        >
          {children}

    function Input({
      type = 'text',
      label,
      value,
      onChange,
      placeholder,
      error,
      disabled = false,
      className = '',
      ...props
    }) {
      return (
        <label className={`block ${className}`}>
          {label && <span className="mb-1.5 block text-sm font-medium text-stone-700">{label}</span>}
          <input
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            aria-invalid={!!error}
            className={
              'w-full rounded-xl border bg-white px-3.5 py-2.5 text-sm text-stone-800 ' +
              'placeholder:text-stone-400 focus:outline-none focus:ring-2 disabled:bg-stone-100 ' +
              (error ? 'border-rose-400 focus:ring-rose-300' : 'border-stone-300 focus:ring-teal-500/50')

    function Card({ className = '', children }) {
      return (

      );
    }

    function Modal({ isOpen, onClose, title, size = 'md', children }) {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => {
          window.removeEventListener('keydown', onKey);
          document.body.style.overflow = '';
        };
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      const sizes = { sm: 'max-w-sm', md: 'max-w-lg', lg: 'max-w-2xl' };

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 p-4 backdrop-blur-sm"
          onClick={onClose}
          role="dialog"
          aria-modal="true"
          aria-label={title}
        >
          <div
            className={`w-full ${sizes[size]} animate-rise-in rounded-2xl bg-white p-6 shadow-xl`}
            onClick={(e) => e.stopPropagation()}
          >
            <div className="mb-4 flex items-start justify-between gap-4">
              <h2 className="text-lg font-semibold text-stone-800">{title}</h2>
              <button
                onClick={onClose}
                aria-label="닫기"
                className="-m-1 rounded-full p-1 text-stone-400 transition hover:bg-stone-100 hover:text-stone-700"
              >
                ✕
              </button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function Badge({ tone = 'neutral', className = '', children }) {
      const tones = {
        neutral: 'bg-stone-100 text-stone-600 ring-stone-200',
        teal:    'bg-teal-50 text-teal-700 ring-teal-200',
        rose:    'bg-rose-50 text-rose-700 ring-rose-200',

      return (
        <span
          className={`inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[11px] font-medium ring-1 ${tones[tone]} ${className}`}

          {children}
        </span>

    // ========================================
    // 📡 OpenAI API (스트리밍 호출)
    // ========================================

    // Chat Completions 를 스트리밍으로 호출하고, 조각이 올 때마다 onDelta 로 흘려 보낸다.
    async function streamChatCompletion({ apiKey, messages, signal, onDelta }) {
      const res = await fetch(OPENAI_URL, {
        method: 'POST',
        signal,
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${apiKey}`,
        },
        body: JSON.stringify({
          model: MODEL,
          messages,
          stream: true,
          temperature: 0.8,
          max_tokens: 700,
        }),
      });

      if (!res.ok) {
        let detail = '';
        try {
          const json = await res.json();
          detail = (json && json.error && json.error.message) || '';
        } catch (e) {
          detail = '';
        }
        if (res.status === 401) {
          throw new Error('API 키가 유효하지 않습니다. 우측 상단 ⚙️ 에서 키를 다시 입력해 주세요.');
        }
        if (res.status === 429) {
          throw new Error('요청이 너무 많거나 사용 한도를 초과했습니다. 잠시 후 다시 시도해 주세요.');
        }
        throw new Error(detail || `요청에 실패했습니다. (HTTP ${res.status})`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // 마지막 조각은 다음 청크와 이어 붙인다

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith('data:')) continue;

          const payload = trimmed.slice(5).trim();
          if (payload === '[DONE]') return;

          try {
            const json = JSON.parse(payload);
            const delta = json.choices && json.choices[0] && json.choices[0].delta;
            if (delta && delta.content) onDelta(delta.content);
          } catch (e) {
            // 불완전한 JSON 조각은 무시
          }
        }
      }
    }

    // ========================================

    function Composer({ value, onChange, onSend, onStop, loading }) {
      const textareaRef = useRef(null);

      // 입력 길이에 따라 높이 자동 조절
      useEffect(() => {
        const el = textareaRef.current;
        if (!el) return;
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 160) + 'px';
      }, [value]);

      const handleKeyDown = (e) => {
        // 한글 조합 중 Enter 는 전송하지 않는다
        if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing) {
          e.preventDefault();
          onSend();
        }
      };

      return (
        <div className="border-t border-stone-200/80 bg-stone-100/90 backdrop-blur">
          <div className="mx-auto max-w-3xl px-4 py-3">
            <div className="flex items-end gap-2 rounded-2xl bg-white p-2 shadow-sm ring-1 ring-stone-200/70 focus-within:ring-2 focus-within:ring-teal-500/50">
              <textarea
                ref={textareaRef}
                rows={1}
                value={value}
                onChange={(e) => onChange(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder="지금 떠오르는 마음을 적어 보세요…"
                aria-label="메시지 입력"
                className="no-scrollbar max-h-40 flex-1 resize-none bg-transparent px-2.5 py-2 text-[15px] leading-relaxed text-stone-800 placeholder:text-stone-400 focus:outline-none"
              />
              {loading ? (
                <Button variant="secondary" onClick={onStop} className="shrink-0">
                  ■ 중단
                </Button>
              ) : (
                <Button onClick={onSend} disabled={!value.trim()} className="shrink-0">
                  보내기
                </Button>
              )}
            </div>
            <p className="mt-2 px-1 text-center text-[11px] leading-relaxed text-stone-400">
              Enter 전송 · Shift+Enter 줄바꿈 &nbsp;|&nbsp; 마음결은 AI이며 전문 의료·상담 서비스를 대체하지 않습니다.
            </p>
          </div>
        </div>
      );
    }

    function SettingsModal({ isOpen, onClose, apiKey, onSave }) {
      const [draft, setDraft] = useState(apiKey);
      const [error, setError] = useState('');

      useEffect(() => {
        if (isOpen) {
          setDraft(apiKey);
          setError('');
        }
      }, [isOpen, apiKey]);

      const handleSave = () => {
        const trimmed = draft.trim();
        if (!trimmed.startsWith('sk-')) {
          setError('OpenAI 키는 sk- 로 시작합니다.');
          return;
        }
        onSave(trimmed);
        onClose();
      };

      return (
        <Modal isOpen={isOpen} onClose={onClose} title="OpenAI API 키">
          <div className="space-y-4">
            <Input
              type="password"
              label="API Key"
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
              placeholder="sk-proj-…"
              error={error}
            />
            <div className="rounded-xl bg-amber-50 p-3 text-xs leading-relaxed text-amber-900 ring-1 ring-amber-200">
              이 앱은 브라우저에서 OpenAI API를 <strong>직접</strong> 호출합니다. 키가 그대로 노출되므로
              수업·개인 실습용으로만 쓰고, 실제 서비스에서는 서버를 두고 키를 숨기세요.
            </div>
            <div className="flex justify-end gap-2">
              <Button variant="secondary" onClick={onClose}>취소</Button>
              <Button onClick={handleSave}>저장</Button>
            </div>
          </div>
        </Modal>
      );
    }

    function CounselingChat() {
      const [messages, setMessages] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY_MESSAGES);
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      const [apiKey, setApiKey] = useState(() => {
        try {
          return localStorage.getItem(STORAGE_KEY_APIKEY) || DEFAULT_API_KEY;
        } catch (e) {
          return DEFAULT_API_KEY;
        }
      });

      const [input, setInput] = useState('');
      const [streamingText, setStreamingText] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [settingsOpen, setSettingsOpen] = useState(false);

      const abortRef = useRef(null);
      const bottomRef = useRef(null);

      // 대화 저장
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY_MESSAGES, JSON.stringify(messages));
        } catch (e) {
          /* 저장 실패는 조용히 무시 */
        }
      }, [messages]);

      // API 키 저장
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY_APIKEY, apiKey);
        } catch (e) {
          /* 무시 */
        }
      }, [apiKey]);

      // 새 내용이 생기면 항상 맨 아래로
      useEffect(() => {
        if (bottomRef.current) {
          bottomRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }
      }, [messages, streamingText, loading]);

      // 언마운트 시 진행 중인 요청 정리
      useEffect(() => {
        return () => {
          if (abortRef.current) abortRef.current.abort();
        };
      }, []);

      const crisisDetected = useMemo(
        () => messages.some((m) => m.role === 'user' && containsCrisisSignal(m.content)),
        [messages]
      );

      const send = useCallback(
        async (rawText) => {
          const text = (rawText || '').trim();
          if (!text || loading) return;

          setError('');
          setInput('');

          const nextMessages = messages.concat({ role: 'user', content: text });
          setMessages(nextMessages);
          setLoading(true);
          setStreamingText('');

          const controller = new AbortController();
          abortRef.current = controller;

          let accumulated = '';

          try {
            await streamChatCompletion({
              apiKey,
              signal: controller.signal,
              messages: [{ role: 'system', content: SYSTEM_PROMPT }].concat(
                nextMessages.map((m) => ({ role: m.role, content: m.content }))
              ),
              onDelta: (delta) => {
                accumulated += delta;
                setStreamingText(accumulated);
              },
            });

            if (accumulated.trim()) {
              setMessages((prev) => prev.concat({ role: 'assistant', content: accumulated }));
            }
          } catch (e) {
            if (e.name === 'AbortError') {
              // 사용자가 직접 중단 → 지금까지 받은 내용은 남겨 둔다
              if (accumulated.trim()) {
                setMessages((prev) => prev.concat({ role: 'assistant', content: accumulated }));
              }
            } else {
              setError(e.message || '알 수 없는 오류가 발생했습니다.');
            }
          } finally {
            abortRef.current = null;
            setStreamingText('');
            setLoading(false);
          }
        },
        [apiKey, loading, messages]
      );

      const stop = useCallback(() => {
        if (abortRef.current) abortRef.current.abort();
      }, []);

      const reset = useCallback(() => {
        if (messages.length && !window.confirm('지금까지의 대화를 모두 지울까요?')) return;
        if (abortRef.current) abortRef.current.abort();
        setMessages([]);
        setStreamingText('');
        setError('');
      }, [messages.length]);

      const isEmpty = messages.length === 0 && !loading;

      return (
        <div className="flex h-[100dvh] flex-col bg-stone-100">
          <Header
            onReset={reset}
            onOpenSettings={() => setSettingsOpen(true)}
            hasMessages={messages.length > 0}
          />

          <main className="flex-1 overflow-y-auto">
            <div className="mx-auto max-w-3xl space-y-4 px-4 py-6">
              {isEmpty ? (
                <EmptyState onPick={(t) => send(t)} />
              ) : (
                <React.Fragment>
                  {messages.map((m, i) => (
                    <MessageBubble key={i} role={m.role} content={m.content} />
                  ))}
                  {loading && streamingText && (
                    <MessageBubble role="assistant" content={streamingText} streaming />
                  )}
                  {loading && !streamingText && <TypingIndicator />}
                </React.Fragment>
              )}

              {crisisDetected && <CrisisNotice />}

              {error && (
                <div
                  role="alert"
                  className="animate-rise-in flex items-start gap-3 rounded-2xl border border-rose-200 bg-rose-50 p-4 text-sm text-rose-800"
                >
                  <span aria-hidden="true">⚠️</span>
                  <div className="flex-1">
                    <p className="leading-relaxed">{error}</p>
                    <button
                      onClick={() => setError('')}
                      className="mt-2 text-xs font-medium text-rose-600 underline underline-offset-2 hover:text-rose-800"
                    >
                      닫기
                    </button>
                  </div>
                </div>
              )}

              <div ref={bottomRef} />
            </div>
          </main>

          <Composer
            value={input}
            onChange={setInput}
            onSend={() => send(input)}
            onStop={stop}
            loading={loading}
          />

          <SettingsModal
            isOpen={settingsOpen}
            onClose={() => setSettingsOpen(false)}
            apiKey={apiKey}
            onSave={setApiKey}
          />
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================

    function App() {
      return <CounselingChat />;
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
