function Modal({ isOpen, onClose, title, children }) {
  useEffect(() => {
    if (!isOpen) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = prev;
    };
  }, [isOpen, onClose]);

  if (!isOpen) return null;
  return (
    <div
      className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4 backdrop-blur-sm"
      role="dialog" aria-modal="true" aria-label={title}
      onClick={onClose}
    >
      <div className="relative max-h-full w-full max-w-2xl overflow-auto" onClick={(e) => e.stopPropagation()}>
        <div className="mb-3 flex items-center justify-between gap-4">
          <h3 className="text-sm font-medium text-zinc-300">{title}</h3>
          <Button variant="secondary" size="sm" onClick={onClose} aria-label="닫기">닫기 ✕</Button>
        </div>
        {children}
      </div>
    </div>
  );
}

          ))}
        </dl>

        <div className="fade-up mt-9 flex flex-wrap gap-3" style={{ animationDelay: '.24s' }}>
          <a href="#picks"><Button size="lg">픽 3선 보기 ↓</Button></a>
          <a href="#method"><Button variant="secondary" size="lg">어떻게 골랐나</Button></a>
        </div>
      </div>
    </section>
  );
}

              </span>

          <div className={`absolute left-3 top-3 flex items-center gap-1.5 rounded-full bg-gradient-to-r ${pick.accent} px-3 py-1 text-xs font-bold text-zinc-900 shadow-lg`}>

            <Stat label="댓글" value={fmt(pick.comments)} />

                {pick.author} @{pick.authorHandle}
              </a>
              <span className="text-zinc-500"> · 팔로워 {fmtFollowers(pick.followers)}</span>
            </InfoRow>
            <InfoRow icon="🗓" label="게시일">{pick.date}</InfoRow>

          {pick.caution && (
            <p className="mt-4 rounded-lg bg-red-500/[0.07] px-3 py-2 text-xs text-red-300/90 ring-1 ring-red-400/15">
              ⚠️ {pick.caution}

          <div className="mt-5 flex flex-wrap gap-2">
            <a href={pick.link} target="_blank" rel="noopener noreferrer">

            </a>
            {pick.storeHandle && (
              <a href={`https://www.instagram.com/${pick.storeHandle}/`} target="_blank" rel="noopener noreferrer">
                <Button variant="secondary" size="sm">@{pick.storeHandle} ↗</Button>

            {pick.place && (
              <a href={`https://map.naver.com/p/search/${encodeURIComponent(pick.name + ' ' + pick.place)}`}

function PicksSection({ onOpenImage }) {
  return (
    <section id="picks" className="mx-auto max-w-6xl scroll-mt-20 px-5 py-16">
      <SectionTitle
        eyebrow="The Picks"
        title="최종 픽 3곳"
        desc="제3자 리뷰·큐레이션 계정 게시물만 놓고 좋아요 순으로 정렬한 결과입니다. 스크린샷을 누르면 원본 게시물 캡처를 크게 볼 수 있습니다."
      />
      <div className="space-y-6">
        {PICKS.map((p) => (
          <PickCard key={p.name} pick={p} onOpenImage={onOpenImage} />
        ))}
      </div>

const COLUMNS = [
  { key: 'name',       label: '가게',      align: 'left',  sortable: false },
  { key: 'cat',        label: '업종',      align: 'left',  sortable: false },
  { key: 'likes',      label: '좋아요',    align: 'right', sortable: true },
  { key: 'comments',   label: '댓글',      align: 'right', sortable: true },
  { key: 'shares',     label: '공유',      align: 'right', sortable: true },
  { key: 'engagement', label: '참여율',    align: 'right', sortable: true },
  { key: 'author',     label: '작성 계정', align: 'left',  sortable: false },
  { key: 'date',       label: '게시일',    align: 'left',  sortable: true },
  { key: 'note',       label: '판정',      align: 'left',  sortable: false },
];

function CompareSection() {
  const [sortKey, setSortKey] = useState('likes');
  const [desc, setDesc] = useState(true);
  const [showExcluded, setShowExcluded] = useState(true);

  const rows = useMemo(() => {
    const list = CANDIDATES
      .filter((c) => showExcluded || c.verdict !== 'excluded')
      .map((c) => ({ ...c, engagement: engagement(c) }));

    const val = (r) => {
      const v = r[sortKey];
      if (sortKey === 'date') return v;
      return v === null || v === undefined ? -Infinity : v;
    };
    return list.sort((a, b) => {
      const av = val(a), bv = val(b);
      if (typeof av === 'string' || typeof bv === 'string') {
        return desc ? String(bv).localeCompare(String(av)) : String(av).localeCompare(String(bv));
      }
      if (av === bv) return a.name.localeCompare(b.name, 'ko');
      return desc ? bv - av : av - bv;
    });
  }, [sortKey, desc, showExcluded]);

  const maxLikes = useMemo(() => Math.max(...rows.map((r) => r.likes || 0), 1), [rows]);

  const toggleSort = useCallback((key) => {
    setSortKey((prev) => {
      if (prev === key) { setDesc((d) => !d); return prev; }
      setDesc(true);
      return key;
    });
  }, []);

  const verdictBadge = (r) => {
    if (r.verdict === 'pick') return <Badge variant="accent">✅ {r.rank}위</Badge>;
    if (r.verdict === 'excluded') return <Badge variant="danger">❌ 제외</Badge>;
    if (r.verdict === 'runner') return <Badge>4위</Badge>;
    return <Badge variant="muted">{r.note}</Badge>;
  };

  return (
    <section id="compare" className="mx-auto max-w-6xl scroll-mt-20 px-5 py-16">
      <SectionTitle
        eyebrow="Full Data"
        title="후보 12건 비교표"
        desc="열 제목을 누르면 정렬됩니다. 참여율은 좋아요 ÷ 작성 계정 팔로워 값으로, 계정 규모 차이를 보정해서 보고 싶을 때 쓰세요."
      />

      <div className="mb-4 flex flex-wrap items-center gap-3">
        <Button variant={showExcluded ? 'secondary' : 'primary'} size="sm" onClick={() => setShowExcluded((v) => !v)}>
          {showExcluded ? '공식계정 3건 숨기기' : '공식계정 3건 다시 보기'}
        </Button>
        <span className="text-xs text-zinc-500">
          정렬: <strong className="text-zinc-300">{COLUMNS.find((c) => c.key === sortKey)?.label}</strong> {desc ? '내림차순' : '오름차순'}
        </span>
      </div>

      <Card className="overflow-hidden">
        <div className="thin-scroll overflow-x-auto">
          <table className="w-full min-w-[880px] text-sm">
            <caption className="sr-only">#신사맛집 후보 게시물 반응 비교표</caption>
            <thead>
              <tr className="border-b border-white/10 bg-white/[0.02]">
                {COLUMNS.map((col) => (
                  <th key={col.key} scope="col"
                      aria-sort={sortKey === col.key ? (desc ? 'descending' : 'ascending') : 'none'}
                      className={`px-3 py-3 text-xs font-semibold text-zinc-400 ${col.align === 'right' ? 'text-right' : 'text-left'}`}>
                    {col.sortable ? (
                      <button type="button" onClick={() => toggleSort(col.key)}
                        className="rounded px-1 py-0.5 transition-colors hover:text-zinc-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-orange-400/60">
                        {col.label}
                        <span aria-hidden="true" className={sortKey === col.key ? 'ml-1 text-orange-400' : 'ml-1 text-zinc-700'}>
                          {sortKey === col.key ? (desc ? '▼' : '▲') : '↕'}
                        </span>
                      </button>
                    ) : col.label}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => {
                const isPick = r.verdict === 'pick';
                const isExcluded = r.verdict === 'excluded';
                return (
                  <tr key={r.name}
                      className={`border-b border-white/[0.05] transition-colors last:border-0 hover:bg-white/[0.04] ${isExcluded ? 'opacity-55' : ''} ${isPick ? 'bg-orange-500/[0.05]' : ''}`}>
                    <th scope="row" className="px-3 py-3 text-left font-bold text-zinc-100">{r.name}</th>
                    <td className="px-3 py-3 text-zinc-400">{r.cat}</td>
                    <td className="px-3 py-3 text-right">
                      <div className={`num font-bold ${isPick ? 'text-orange-300' : 'text-zinc-200'}`}>{fmt(r.likes)}</div>
                      {r.likes !== null && (
                        <div className="mt-1 h-1 w-full overflow-hidden rounded-full bg-white/[0.06]">
                          <div className={`bar h-full rounded-full ${isPick ? 'bg-orange-400' : 'bg-zinc-500'}`}
                               style={{ width: `${(r.likes / maxLikes) * 100}%` }} />
                        </div>
                      )}
                    </td>
                    <td className="num px-3 py-3 text-right text-zinc-300">{fmt(r.comments)}</td>
                    <td className="num px-3 py-3 text-right text-zinc-300">{r.shares === null ? '—' : fmt(r.shares)}</td>
                    <td className="num px-3 py-3 text-right text-zinc-300">
                      {r.engagement === null ? '—' : r.engagement.toFixed(2) + '%'}
                    </td>
                    <td className="px-3 py-3 text-zinc-400">
                      {r.author}
                      <span className="block text-[11px] text-zinc-600">팔로워 {fmtFollowers(r.followers)}</span>
                    </td>
                    <td className="num px-3 py-3 text-zinc-500">{r.date}</td>
                    <td className="px-3 py-3">{verdictBadge(r)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>

      <p className="mt-4 text-xs leading-relaxed text-zinc-500">
        프렌치쪽갈비·멘쇼쿠는 좋아요 수가 비공개라 참여율을 계산할 수 없습니다(— 로 표시).
      </p>
    </section>
  );
}

function MethodSection() {
  return (
    <section id="method" className="scroll-mt-20 border-y border-white/[0.06] bg-white/[0.015]">
      <div className="mx-auto max-w-6xl px-5 py-16">
        <SectionTitle
          eyebrow="Method"
          title="어떻게 골랐나"
          desc={`Playwright MCP로 #신사맛집 해시태그를 검색해 단일 가게를 소개하는 게시물 13건을 개별 방문했습니다. (로그인 계정 @ruucm · 조사일 ${SURVEY_DATE})`}
        />
        <div className="grid gap-4 md:grid-cols-3">
          {CRITERIA.map((c) => (
            <Card key={c.n} className="p-6">
              <div className="num text-3xl font-black text-white/10">{c.n}</div>
              <h3 className="mt-3 text-base font-bold text-zinc-100">{c.title}</h3>
              <p className="mt-2 text-sm leading-relaxed text-zinc-400">{c.body}</p>
            </Card>
          ))}
        </div>
      </div>
    </section>
  );
}

function NotesSection() {
  return (
    <section id="notes" className="mx-auto max-w-6xl scroll-mt-20 px-5 py-16">
      <SectionTitle eyebrow="Caveats" title="읽기 전에 알아둘 것" />
      <ul className="space-y-3">
        {NOTES.map((n, i) => (
          <li key={i} className="flex gap-3 rounded-xl bg-white/[0.025] px-4 py-3.5 ring-1 ring-white/[0.06]">
            <span aria-hidden="true" className="mt-0.5 text-amber-400/80">⚠️</span>
            <span className="text-sm leading-relaxed text-zinc-400">{n}</span>
          </li>
        ))}
      </ul>
    </section>
  );
}

function Footer() {
  return (
    <footer className="border-t border-white/[0.06]">
      <div className="mx-auto flex max-w-6xl flex-col gap-4 px-5 py-10 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <div className="font-display text-sm font-bold text-zinc-300">#신사맛집 인스타 픽 3선</div>
          <p className="mt-1 text-xs text-zinc-600">
            출처: Instagram 해시태그 검색 · 조사일 {SURVEY_DATE} · 수치는 조사 시점 기준
          </p>
        </div>
        <a href={TAG_URL} target="_blank" rel="noopener noreferrer">
          <Button variant="secondary" size="sm">인스타그램에서 직접 보기 ↗</Button>
        </a>
      </div>
    </footer>
  );
}

// ========================================
// 🚀 App
// ========================================

function App() {
  const [zoomed, setZoomed] = useState(null);
  const closeZoom = useCallback(() => setZoomed(null), []);

  return (
    <div className="min-h-screen">
      <a href="#picks" className="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-full focus:bg-white focus:px-4 focus:py-2 focus:text-sm focus:text-zinc-900">
        본문으로 건너뛰기
      </a>
      <Header />
      <main>
        <Hero />
        <PicksSection onOpenImage={setZoomed} />
        <CompareSection />
        <MethodSection />
        <NotesSection />
      </main>
      <Footer />

      <Modal isOpen={!!zoomed} onClose={closeZoom} title={zoomed ? `${zoomed.name} · 원본 게시물 스크린샷` : ''}>
        {zoomed && (
          <div>
            <img src={zoomed.image} alt={`${zoomed.name} 인스타그램 게시물 스크린샷 (확대)`}
                 className="w-full rounded-xl ring-1 ring-white/10" />
            <div className="mt-3 flex justify-center">
              <a href={zoomed.link} target="_blank" rel="noopener noreferrer">
                <Button variant="insta" size="sm">인스타그램에서 열기 ↗</Button>
              </a>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
