    const STAGE_W = 1280;
    const STAGE_H = 720;

    function useStageScale() {
      const [scale, setScale] = useState(1);
      useEffect(() => {
        const fit = () => setScale(Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H));
        fit();
        window.addEventListener('resize', fit);
        return () => window.removeEventListener('resize', fit);
      }, []);
      return scale;
    }

    function Stage({ children }) {
      const scale = useStageScale();
      return (
        <div className="fixed inset-0 flex items-center justify-center bg-black">
          <div
            className="relative overflow-hidden bg-snow-50"
            style={{ width: STAGE_W, height: STAGE_H, transform: `scale(${scale})`, transformOrigin: 'center center' }}
          >
            {children}
          </div>
        </div>
      );
    }

      return (

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      const [index, setIndex] = useState(() => {
        const n = parseInt(window.location.hash.replace('#', ''), 10);
        return Number.isFinite(n) && n >= 1 && n <= SLIDES.length ? n - 1 : 0;
      });
      const [showGrid, setShowGrid] = useState(false);
      const touchX = useRef(null);

      const total = SLIDES.length;
      const slide = SLIDES[index];

      const go = useCallback((next) => {
        setIndex((cur) => {
          const v = Math.max(0, Math.min(total - 1, typeof next === 'function' ? next(cur) : next));
          window.location.hash = String(v + 1);
          return v;
        });
      }, [total]);

      // 키보드 내비게이션
      useEffect(() => {
        const onKey = (e) => {
          const k = e.key;
          if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Enter') {
            e.preventDefault(); setShowGrid(false); go((i) => i + 1);
          } else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') {
            e.preventDefault(); setShowGrid(false); go((i) => i - 1);
          } else if (k === 'Home') {
            e.preventDefault(); go(0);
          } else if (k === 'End') {
            e.preventDefault(); go(total - 1);
          } else if (k === 'o' || k === 'O' || k === 'ㅐ') {
            e.preventDefault(); setShowGrid((v) => !v);
          } else if (k === 'Escape') {
            setShowGrid(false);
          } else if (k === 'f' || k === 'F' || k === 'ㄹ') {
            e.preventDefault();
            if (document.fullscreenElement) document.exitFullscreen();
            else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [go, total]);

      // 해시 직접 변경 대응 (뒤로 가기 등)
      useEffect(() => {
        const onHash = () => {
          const n = parseInt(window.location.hash.replace('#', ''), 10);
          if (Number.isFinite(n) && n >= 1 && n <= total) setIndex(n - 1);
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, [total]);

      // 터치 스와이프
      const onTouchStart = (e) => { touchX.current = e.touches[0].clientX; };
      const onTouchEnd = (e) => {
        if (touchX.current === null) return;
        const dx = e.changedTouches[0].clientX - touchX.current;
        if (Math.abs(dx) > 50) go((i) => i + (dx < 0 ? 1 : -1));
        touchX.current = null;
      };

      return (
        <div onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
          <Stage>
            {/* key 를 바꿔 슬라이드마다 진입 애니메이션을 다시 재생 */}
            <div key={slide.key} className="w-full h-full">
              {slide.render()}
            </div>

            <ProgressBar index={index} total={total} accent={slide.dark ? '#FFFFFF' : slide.accent} />
            <SlideCounter index={index} total={total} light={slide.dark} />

            {/* 클릭 내비게이션 (좌 30% 이전 / 우 70% 다음) */}
            {!showGrid && (
              <React.Fragment>
                <button className="absolute inset-y-0 left-0 w-[30%] z-10 cursor-default" onClick={() => go((i) => i - 1)} aria-label="이전 슬라이드" />
                <button className="absolute inset-y-0 right-0 w-[70%] z-10 cursor-default" onClick={() => go((i) => i + 1)} aria-label="다음 슬라이드" />
              </React.Fragment>
            )}

            {showGrid && (
              <OverviewGrid index={index} onPick={(i) => { go(i); setShowGrid(false); }} onClose={() => setShowGrid(false)} />
            )}
          </Stage>
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
