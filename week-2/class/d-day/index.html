<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-Day 카운터</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    /* Tailwind 유틸리티로 표현 불가능한 애니메이션만 정의 */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fade-up 0.35s ease-out both; }

    @keyframes pop {
      0%   { transform: scale(0.94); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop { animation: pop 0.2s ease-out both; }

    /* 숫자가 흔들리지 않도록 고정폭 숫자 */
    .tnum { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ========================================
    // 🛠️ Utilities
    // ========================================

    const STORAGE_KEY = 'dday-counter-items-v1';
    const MS_PER_DAY = 24 * 60 * 60 * 1000;

    const THEMES = {
      rose:    { name: '로즈',     ring: 'ring-rose-400/40',    grad: 'from-rose-500 to-pink-600',     dot: 'bg-rose-400' },
      amber:   { name: '앰버',     ring: 'ring-amber-400/40',   grad: 'from-amber-500 to-orange-600',  dot: 'bg-amber-400' },
      emerald: { name: '에메랄드', ring: 'ring-emerald-400/40', grad: 'from-emerald-500 to-teal-600',  dot: 'bg-emerald-400' },
      sky:     { name: '스카이',   ring: 'ring-sky-400/40',     grad: 'from-sky-500 to-blue-600',      dot: 'bg-sky-400' },
      violet:  { name: '바이올렛', ring: 'ring-violet-400/40',  grad: 'from-violet-500 to-purple-600', dot: 'bg-violet-400' },
      slate:   { name: '슬레이트', ring: 'ring-slate-400/40',   grad: 'from-slate-400 to-slate-600',   dot: 'bg-slate-400' },
    };
    const THEME_KEYS = Object.keys(THEMES);

    const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];

    /** 'YYYY-MM-DD' 문자열을 로컬 자정 Date 로 변환 */
    function parseDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d, 0, 0, 0, 0);
    }

    /** Date → 'YYYY-MM-DD' (로컬 기준) */
    function formatDateInput(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDateLabel(dateStr) {
      const d = parseDate(dateStr);
      return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`;
    }

    function startOfDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, 0, 0, 0);
    }

    /**
     * 목표일 기준 D-Day 정보를 계산한다.
     * diffDays > 0 → 미래(D-n) / 0 → 당일(D-DAY) / < 0 → 지난 날(D+n)
     */
    function getDdayInfo(dateStr, now) {
      const target = parseDate(dateStr);
      const today = startOfDay(now);
      const diffDays = Math.round((target.getTime() - today.getTime()) / MS_PER_DAY);

      let label;
      if (diffDays > 0) label = `D-${diffDays}`;
      else if (diffDays === 0) label = 'D-DAY';
      else label = `D+${Math.abs(diffDays)}`;

      // 목표일 자정까지 남은 시간 (미래 일정일 때만 표시)
      const remainMs = Math.max(0, target.getTime() - now.getTime());
      const totalSec = Math.floor(remainMs / 1000);
      const days = Math.floor(totalSec / 86400);
      const hours = Math.floor(totalSec / 3600) % 24;
      const minutes = Math.floor(totalSec / 60) % 60;
      const seconds = totalSec % 60;

      return { diffDays, label, days, hours, minutes, seconds, isPast: diffDays < 0, isToday: diffDays === 0 };
    }

    function loadItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function saveItems(items) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch (e) {
        /* 저장 실패(용량 초과 등)는 무시 — 앱 동작은 계속된다 */
      }
    }

    function createId() {
      return `dday_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, type = 'button', className = '', children, ...rest }) {
      const base = 'inline-flex items-center justify-center gap-2 rounded-xl font-semibold transition-all duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950 disabled:opacity-40 disabled:cursor-not-allowed';

      const variants = {
        primary: 'bg-white text-slate-900 hover:bg-slate-200 focus-visible:ring-white active:scale-95',
        secondary: 'bg-white/10 text-white border border-white/15 hover:bg-white/20 focus-visible:ring-white/50 active:scale-95',
        danger: 'bg-rose-600 text-white hover:bg-rose-500 focus-visible:ring-rose-400 active:scale-95',
        ghost: 'text-slate-300 hover:bg-white/10 hover:text-white focus-visible:ring-white/40',
      };

      const sizes = {
        sm: 'px-3 py-1.5 text-xs',
        md: 'px-4 py-2.5 text-sm',
        lg: 'px-6 py-3 text-base',
      };

      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Input({ type = 'text', label, value, onChange, placeholder, error, disabled = false, className = '', ...rest }) {
      const inputId = useRef(`input_${Math.random().toString(36).slice(2, 9)}`).current;

      return (
        <div className={`w-full ${className}`}>
          {label && (
            <label htmlFor={inputId} className="mb-1.5 block text-sm font-medium text-slate-300">
              {label}
            </label>
          )}
          <input
            id={inputId}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            aria-invalid={!!error}
            className={`w-full rounded-xl border bg-slate-900/80 px-4 py-2.5 text-white placeholder-slate-500 transition-colors focus:outline-none focus:ring-2 disabled:opacity-50 ${
              error
                ? 'border-rose-500/60 focus:border-rose-400 focus:ring-rose-500/30'
                : 'border-white/10 focus:border-white/30 focus:ring-white/20'
            }`}
            {...rest}
          />
          {error && <p className="mt-1.5 text-xs text-rose-400">{error}</p>}
        </div>
      );
    }

    function Card({ className = '', children, ...rest }) {
      return (
        <div
          className={`rounded-2xl border border-white/10 bg-slate-900/60 p-5 shadow-xl shadow-black/30 backdrop-blur ${className}`}
          {...rest}
        >
          {children}
        </div>
      );
    }

    function Badge({ className = '', children }) {
      return (
        <span className={`inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold ${className}`}>
          {children}
        </span>
      );
    }

    function Modal({ isOpen, onClose, title, size = 'md', children }) {
      useEffect(() => {
        if (!isOpen) return;

        const onKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        document.addEventListener('keydown', onKeyDown);

        const prevOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';

        return () => {
          document.removeEventListener('keydown', onKeyDown);
          document.body.style.overflow = prevOverflow;
        };
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      const sizes = { sm: 'max-w-sm', md: 'max-w-md', lg: 'max-w-2xl' };

      return (
        <div
          className="fixed inset-0 z-50 flex items-end justify-center bg-black/70 backdrop-blur-sm sm:items-center sm:p-4"
          role="dialog"
          aria-modal="true"
          aria-label={title}
          onClick={onClose}
        >
          <div
            className={`animate-pop w-full ${sizes[size]} rounded-t-3xl border border-white/10 bg-slate-900 p-6 shadow-2xl sm:rounded-2xl`}
            onClick={(e) => e.stopPropagation()}
          >
            <div className="mb-5 flex items-center justify-between">
              <h2 className="text-lg font-bold text-white">{title}</h2>
              <button
                type="button"
                onClick={onClose}
                aria-label="닫기"
                className="rounded-lg p-1.5 text-slate-400 transition-colors hover:bg-white/10 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/40"
              >
                <svg className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    // ========================================
    // 🧩 Common Components
    // ========================================

    function Header({ count, onAdd }) {
      return (
        <header className="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <h1 className="text-3xl font-black tracking-tight text-white sm:text-4xl">
              D-Day{' '}
              <span className="bg-gradient-to-r from-sky-400 to-violet-400 bg-clip-text text-transparent">카운터</span>
            </h1>
            <p className="mt-2 text-sm text-slate-400">
              {count > 0
                ? `다가오는 일정 ${count}개를 기다리는 중이에요.`
                : '중요한 날을 등록하고 남은 시간을 확인하세요.'}
            </p>
          </div>
          <Button size="lg" onClick={onAdd} className="w-full sm:w-auto">
            <svg className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
              <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            새 D-Day 추가
          </Button>
        </header>
      );
    }

    function EmptyState({ onAdd }) {
      return (
        <Card className="flex flex-col items-center justify-center py-16 text-center">
          <div className="mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-white/5 text-3xl">🗓️</div>
          <h3 className="text-lg font-bold text-white">아직 등록된 D-Day가 없어요</h3>
          <p className="mt-2 max-w-xs text-sm text-slate-400">
            시험, 여행, 기념일처럼 기다리는 날을 추가하면 남은 시간을 실시간으로 세어드려요.
          </p>
          <Button className="mt-6" onClick={onAdd}>
            첫 D-Day 추가하기
          </Button>
        </Card>
      );
    }

    // ========================================
    // 📄 Feature Components
    // ========================================

    function CountdownUnit({ value, unit }) {
      return (
        <div className="flex min-w-[3.25rem] flex-1 flex-col items-center rounded-xl bg-black/30 px-2 py-2">
          <span className="tnum text-xl font-bold text-white">{String(value).padStart(2, '0')}</span>
          <span className="mt-0.5 text-[10px] font-medium tracking-wide text-slate-400">{unit}</span>
        </div>
      );
    }

    function DdayCard({ item, now, onDelete }) {
      const theme = THEMES[item.theme] || THEMES.sky;
      const info = getDdayInfo(item.date, now);

      return (
        <Card className={`animate-fade-up relative overflow-hidden ring-1 ${theme.ring}`}>
          {/* 테마 그라데이션 액센트 */}
          <div className={`pointer-events-none absolute -right-16 -top-16 h-40 w-40 rounded-full bg-gradient-to-br ${theme.grad} opacity-20 blur-2xl`} />

          <div className="relative flex items-start justify-between gap-3">
            <div className="min-w-0">
              <div className="flex items-center gap-2">
                <span className={`h-2 w-2 shrink-0 rounded-full ${theme.dot}`} />
                <h3 className="truncate text-base font-bold text-white">{item.title}</h3>
              </div>
              <p className="mt-1 text-xs text-slate-400">{formatDateLabel(item.date)}</p>
            </div>

            <button
              type="button"
              onClick={() => onDelete(item.id)}
              aria-label={`${item.title} 삭제`}
              className="shrink-0 rounded-lg p-1.5 text-slate-500 transition-colors hover:bg-rose-500/15 hover:text-rose-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-400/50"
            >
              <svg className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>

          <div className="relative mt-5 flex flex-wrap items-baseline gap-x-3 gap-y-1">
            <span className={`tnum bg-gradient-to-r ${theme.grad} bg-clip-text text-4xl font-black tracking-tight text-transparent sm:text-5xl`}>
              {info.label}
            </span>
            {info.isToday && <Badge className="bg-white text-slate-900">오늘이에요! 🎉</Badge>}
            {info.isPast && <Badge className="bg-white/10 text-slate-300">지난 일정</Badge>}
          </div>

          {info.diffDays > 0 && (
            <div className="relative mt-4 flex items-center gap-2">
              <CountdownUnit value={info.days} unit="일" />
              <CountdownUnit value={info.hours} unit="시간" />
              <CountdownUnit value={info.minutes} unit="분" />
              <CountdownUnit value={info.seconds} unit="초" />
            </div>
          )}
        </Card>
      );
    }

    function AddDdayModal({ isOpen, onClose, onSubmit }) {
      const [title, setTitle] = useState('');
      const [date, setDate] = useState('');
      const [theme, setTheme] = useState('sky');
      const [errors, setErrors] = useState({});

      // 모달이 열릴 때마다 폼 초기화
      useEffect(() => {
        if (!isOpen) return;
        setTitle('');
        setDate(formatDateInput(new Date()));
        setTheme(THEME_KEYS[Math.floor(Math.random() * THEME_KEYS.length)]);
        setErrors({});
      }, [isOpen]);

      const handleSubmit = (e) => {
        e.preventDefault();

        const nextErrors = {};
        if (!title.trim()) nextErrors.title = '일정 이름을 입력해 주세요.';
        if (!date) nextErrors.date = '날짜를 선택해 주세요.';

        setErrors(nextErrors);
        if (Object.keys(nextErrors).length > 0) return;

        onSubmit({ id: createId(), title: title.trim(), date, theme });
        onClose();
      };

      return (
        <Modal isOpen={isOpen} onClose={onClose} title="새 D-Day 추가">
          <form onSubmit={handleSubmit} className="space-y-4">
            <Input
              label="일정 이름"
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              placeholder="예: 기말고사, 제주도 여행"
              error={errors.title}
              maxLength={40}
              autoFocus
            />

            <Input
              type="date"
              label="날짜"
              value={date}
              onChange={(e) => setDate(e.target.value)}
              error={errors.date}
            />

            <div>
              <span className="mb-1.5 block text-sm font-medium text-slate-300">색상</span>
              <div className="flex flex-wrap gap-2">
                {THEME_KEYS.map((key) => (
                  <button
                    key={key}
                    type="button"
                    onClick={() => setTheme(key)}
                    aria-label={`${THEMES[key].name} 색상 선택`}
                    aria-pressed={theme === key}
                    className={`h-9 w-9 rounded-full bg-gradient-to-br ${THEMES[key].grad} transition-transform focus:outline-none focus-visible:ring-2 focus-visible:ring-white/60 ${
                      theme === key
                        ? 'scale-110 ring-2 ring-white ring-offset-2 ring-offset-slate-900'
                        : 'opacity-60 hover:scale-105 hover:opacity-100'
                    }`}
                  />
                ))}
              </div>
            </div>

            <div className="flex gap-3 pt-2">
              <Button variant="secondary" onClick={onClose} className="flex-1">
                취소
              </Button>
              <Button type="submit" className="flex-1">
                추가하기
              </Button>
            </div>
          </form>
        </Modal>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      const [items, setItems] = useState(loadItems);
      const [now, setNow] = useState(() => new Date());
      const [isModalOpen, setIsModalOpen] = useState(false);

      // 1초마다 현재 시각 갱신 → 실시간 카운트다운
      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // 목록이 바뀔 때마다 로컬 저장
      useEffect(() => {
        saveItems(items);
      }, [items]);

      const handleAdd = useCallback((item) => {
        setItems((prev) => [...prev, item]);
      }, []);

      const handleDelete = useCallback((id) => {
        setItems((prev) => prev.filter((item) => item.id !== id));
      }, []);

      const openModal = useCallback(() => setIsModalOpen(true), []);
      const closeModal = useCallback(() => setIsModalOpen(false), []);

      const todayKey = startOfDay(now).getTime();

      // 다가오는 일정을 가까운 순으로 먼저, 지난 일정은 최근 순으로 뒤에
      const sortedItems = useMemo(() => {
        return [...items].sort((a, b) => {
          const da = parseDate(a.date).getTime() - todayKey;
          const db = parseDate(b.date).getTime() - todayKey;
          if (da >= 0 && db >= 0) return da - db;
          if (da < 0 && db < 0) return db - da;
          return da >= 0 ? -1 : 1;
        });
      }, [items, todayKey]);

      const upcomingCount = useMemo(
        () => items.filter((item) => parseDate(item.date).getTime() >= todayKey).length,
        [items, todayKey]
      );

      return (
        <div className="min-h-screen bg-slate-950 bg-[radial-gradient(ellipse_at_top,_rgba(56,189,248,0.14),transparent_55%)]">
          <main className="mx-auto max-w-5xl px-4 py-10 sm:px-6 sm:py-14">
            <Header count={upcomingCount} onAdd={openModal} />

            {sortedItems.length === 0 ? (
              <EmptyState onAdd={openModal} />
            ) : (
              <div className="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
                {sortedItems.map((item) => (
                  <DdayCard key={item.id} item={item} now={now} onDelete={handleDelete} />
                ))}
              </div>
            )}

            <footer className="mt-12 text-center text-xs text-slate-600">
              등록한 D-Day는 이 브라우저에만 저장됩니다.
            </footer>
          </main>

          <AddDdayModal isOpen={isModalOpen} onClose={closeModal} onSubmit={handleAdd} />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
